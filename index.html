<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0A0F1E;
      --indigo: #5B5FEF;
      --silver: #C8CDD8;
      --offwhite: #F7F8FC;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--navy);
      color: var(--offwhite);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.7rem, 1.5vw, 0.85rem);
      letter-spacing: 0.25em;
      color: var(--silver);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.2s;
    }

    .name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3.5rem, 11vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--offwhite);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.45s;
      position: relative;
      display: inline-block;
    }

    .underline-wrap {
      display: block;
      height: 3px;
      margin-top: 0.3em;
      background: var(--navy);
      position: relative;
      overflow: hidden;
    }

    .underline-wrap::after {
      content: '';
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      width: 100%;
      background: var(--indigo);
      transform: scaleX(0);
      transform-origin: left;
      animation: drawLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.1s;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      color: var(--silver);
      margin-top: 2.5rem;
      max-width: 40ch;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1.2s;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1.4s;
    }

    .links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--silver);
      text-decoration: none;
      letter-spacing: 0.05em;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .links a:hover {
      color: var(--offwhite);
      border-bottom-color: var(--indigo);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes drawLine {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, .name, .tagline, .links {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .underline-wrap::after {
        animation: none;
        transform: scaleX(1);
      }
    }
  </style>
</head>
<body>

  <p class="eyebrow">Welcome</p>

  <h1 class="name">
    My name is Abhinaba Dasgupta
    <span class="underline-wrap"></span>
  </h1>

  <p class="tagline">A short line about who you are or what you do goes right here.</p>

  <nav class="links" aria-label="Quick links">
    <a href="https://github.com/">GitHub</a>
    <a href="mailto:you@example.com">Email</a>
    <a href="https://linkedin.com/">LinkedIn</a>
  </nav>

</body>
</html>
